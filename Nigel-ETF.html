<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Styelsy</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .card {
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        p {
            color: #555;
            margin-bottom: 30px;
        }
        button {
            width: 100%;
            padding: 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        #feedback {
            margin-top: 15px;
            font-weight: bold;
            color: #28a745;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>E-Transfer Checkout</h2>
        <p>Tap the button below to copy the email address for your transfer.</p>
        
        <button onclick="copyEmail('Nigelmahendran@gmail.com')">Copy Email Address</button>
        
        <div id="feedback"></div>
    </div>

    <script>
        function copyEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                const feedback = document.getElementById('feedback');
                feedback.innerText = 'Email copied! Ready to paste in your bank app.';
                setTimeout(() => {
                    feedback.innerText = '';
                }, 4000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>

</body>
</html>
