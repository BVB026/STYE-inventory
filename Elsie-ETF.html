<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styelsy Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0d0d0f; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .card {
            background: #151515; 
            padding: 40px 25px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 10px 40px rgba(255, 0, 127, 0.15); 
            width: 100%;
            max-width: 360px;
        }
        .neon-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            margin: 0 0 10px 0;
            color: #fff;
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff007f,
                0 0 40px #ff007f,
                0 0 80px #ff007f;
        }
        p.subtitle {
            color: #a0a0a5;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .email-display-box {
            background: #000000;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            color: #ff99cc; 
            margin-bottom: 20px;
            letter-spacing: 0.5px;
        }
        
        .qr-container {
            background: #ffffff; 
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 25px;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2); 
        }
        .qr-container img {
            display: block;
            width: 150px;
            height: 150px;
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: #151515;
            color: #ff007f;
            border: 2px solid #ff007f;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        button:hover, button.clicked {
            background-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
        }
        .trust-badge {
            margin-top: 25px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #4ade80; 
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* NEW: Instagram Link Styling to match Neon Dark Theme */
        .social-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #a0a0a5; /* Matches the subtitle text */
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            color: #ff007f; /* Neon pink hover */
            text-shadow: 0 0 8px rgba(255, 0, 127, 0.5); /* Subtle glow effect */
        }

        .social-link svg {
            width: 18px;
            height: 18px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="neon-logo">Styelsy</h1>
        
        <p class="subtitle">Tap below to copy the transfer email.</p>
        
        <div class="email-display-box">
            M.Elsie@hotmail.com
        </div>

        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://styelsy.netlify.app/elsie-etf" alt="Scan to open checkout page">
        </div>
        
        <button id="copyBtn" onclick="copyEmail('M.Elsie@hotmail.com')">Copy Email Address</button>
        
        <div class="trust-badge">
            🔒 Auto-deposit enabled
        </div>

        <!-- NEW: Instagram Link -->
        <a href="https://www.instagram.com/styelsy/" target="_blank" class="social-link">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            Follow @styelsy
        </a>
    </div>

    <script>
        function copyEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                const btn = document.getElementById('copyBtn');
                
                btn.innerText = 'Copied! ✅';
                btn.classList.add('clicked');
                
                setTimeout(() => {
                    btn.innerText = 'Copy Email Address';
                    btn.classList.remove('clicked');
                }, 3000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert("Please manually copy the email from the box above.");
            });
        }
    </script>

</body>
</html>
