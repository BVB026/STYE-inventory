<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rapid POS Logger</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { text-align: center; margin-top: 0; color: #ff007f; }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #aaa; }
        
        input[type="text"], input[type="tel"] {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 18px;
            box-sizing: border-box;
        }
        
        /* The Grid for Big Tap Buttons */
        .grid-options {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }
        .grid-options.two-col {
            grid-template-columns: 1fr 1fr;
        }
        
        /* Styling the Radio Buttons to look like App Buttons */
        .grid-options input[type="radio"] { display: none; }
        .grid-options label.btn {
            background: #222;
            border: 2px solid #444;
            border-radius: 8px;
            padding: 15px 5px;
            text-align: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
            margin: 0;
            color: #ddd;
        }
        .grid-options input[type="radio"]:checked + label.btn {
            background: #ff007f;
            border-color: #ff007f;
            color: white;
        }

        button.submit-btn {
            width: 100%;
            padding: 18px;
            background-color: #4ade80;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        #status { text-align: center; margin-top: 15px; font-weight: bold; min-height: 24px; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚡ Quick Checkout</h2>
    <form id="pos-form">
        
        <div class="input-group">
            <label>Price Sold For ($)</label>
            <input type="text" inputmode="numeric" id="price" placeholder="0.00">
        </div>

        <div class="input-group">
            <label>Payment Method</label>
            <div class="grid-options">
                <input type="radio" id="pay-cash" name="method" value="Cash">
                <label for="pay-cash" class="btn">💵 Cash</label>
                
                <input type="radio" id="pay-square" name="method" value="Square">
                <label for="pay-square" class="btn">💳 Square</label>
                
                <input type="radio" id="pay-etf" name="method" value="ETF">
                <label for="pay-etf" class="btn">🏦 ETF</label>
            </div>
        </div>

        <div class="input-group">
            <label>Vendor (Whose item is it?)</label>
            <div class="grid-options two-col">
                <input type="radio" id="ven-styelsy" name="vendor" value="Styelsy" checked>
                <label for="ven-styelsy" class="btn">Styelsy</label>
                
                <input type="radio" id="ven-sofia" name="vendor" value="Sofia">
                <label for="ven-sofia" class="btn">Sofia</label>
                
                <input type="radio" id="ven-friend2" name="vendor" value="Friend B">
                <label for="ven-friend2" class="btn">Friend B</label>
                
                <input type="radio" id="ven-split" name="vendor" value="Split/Bundle">
                <label for="ven-split" class="btn">Split Bundle</label>
            </div>
        </div>

        <div class="input-group">
  <label for="market">Market Location:</label>
  <select id="market" name="market">
    <option value="Good Friends">Good Friends</option>
    <option value="IDK">IDK</option>
    <option value="Offline">Offline</option>
    <option value="Other">Other</option>
  </select>
</div>

        <div class="input-group">
            <label>Item SKU (Optional)</label>
            <input type="text" id="sku" placeholder="e.g. JKT-0426-15">
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">LOG SALE</button>
        <div id="status"></div>
    </form>
</div>

<script>
    // --- SQUARE-STYLE AUTO DECIMAL LOGIC ---
    const priceInput = document.getElementById('price');
    
    priceInput.addEventListener('input', function(e) {
        // Strip out everything except numeric digits
        let rawNumbers = this.value.replace(/\D/g, '');
        
        // If the user clears the box, leave it blank
        if (!rawNumbers) {
            this.value = '';
            return;
        }
        
        // Convert to an integer, then divide by 100 to get the decimal
        // e.g., typing '4555' becomes 4555 / 100 = 45.55
        let formattedNumber = (parseInt(rawNumbers, 10) / 100).toFixed(2);
        
        // Update the display
        this.value = formattedNumber;
    });

    // --- FORM SUBMISSION LOGIC ---
    document.getElementById('pos-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const btn = document.getElementById('submit-btn');
        const status = document.getElementById('status');
        
        const priceNode = document.getElementById('price').value;
        const methodNode = document.querySelector('input[name="method"]:checked');
        const vendorNode = document.querySelector('input[name="vendor"]:checked');

        // Check if anything essential is missing (or if price is left at exactly 0.00)
        if (!priceNode || priceNode === '0.00' || !methodNode || !vendorNode) {
            btn.innerText = 'MISSING INFO!';
            btn.style.backgroundColor = '#ff4444'; 
            status.style.color = '#ff4444';
            status.innerText = '⚠️ Please fill out the Price and Payment Method.';
            
            setTimeout(() => {
                btn.innerText = 'LOG SALE';
                btn.style.backgroundColor = '#4ade80';
                status.innerText = '';
            }, 2500);
            
            if (navigator.vibrate) navigator.vibrate(200);
            return; 
        }

        btn.innerText = 'LOGGING...';
        
        const price = priceNode;
        const method = methodNode.value;
        const vendor = vendorNode.value;
        const sku = document.getElementById('sku').value;

        // PASTE YOUR NEW WEBHOOK URL HERE
        const backendURL = 'https://script.google.com/macros/s/AKfycbxURZgSBA8FFqbLDUq5NX59lyflJ2Ybl8S7svRYKEE6AZEpMRNT-mUSwy0TsT3YnNNfoA/exec';
        
        fetch(backendURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ price, method, vendor, sku })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('pos-form').reset();
            
            document.getElementById('ven-styelsy').checked = true; 
            
            btn.innerText = 'LOG SALE';
            btn.style.backgroundColor = '#4ade80';
            status.style.color = '#4ade80';
            status.innerText = 'Sale Logged! Ready for next.';
            setTimeout(() => status.innerText = '', 2000);
        })
        .catch(err => {
            btn.innerText = 'ERROR';
            btn.style.backgroundColor = '#ff4444';
            status.style.color = '#ff4444';
            status.innerText = 'Check your connection.';
        });
    });
</script>

</body>
</html>
